name: CI

on:
  push:
    branches: [DEFAULT_BRANCH]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@PIN
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@PIN

      - name: Run pre-commit hooks
        run: uvx pre-commit run --all-files --show-diff-on-failure

      # block: uv project
      - name: Install the locked environment
        if: ${{ !cancelled() }}
        run: uv sync --locked

      - name: Run tests
        if: ${{ !cancelled() }}
        run: TEST_COMMAND
      # end block

      # block: OpenSpec
      - name: Install OpenSpec
        if: ${{ !cancelled() }}
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate OpenSpec changes and specs
        if: ${{ !cancelled() }}
        run: npx openspec validate --all --no-interactive

      - name: Check generated OpenSpec files match the pinned version
        if: ${{ !cancelled() }}
        run: |
          npx openspec update --force > /dev/null
          git diff --exit-code -- .claude
      # end block
